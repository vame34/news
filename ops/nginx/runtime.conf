log_format timed_main '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time '
                      'ua="$upstream_addr" us="$upstream_status" '
                      'ref="$http_referer" ua_str="$http_user_agent"';

server {
    listen 80;
    server_name radararena.ru www.radararena.ru;

    access_log /var/log/nginx/access_timed.log timed_main;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Internal container-to-container API calls must stay on plain HTTP.
    set $backend_upstream http://app_blue:9000;
    include /etc/nginx/includes/backend-upstream.inc;
    location /api/ {
        proxy_pass $backend_upstream;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name radararena.ru www.radararena.ru;

    access_log /var/log/nginx/access_timed.log timed_main;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/radararena.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radararena.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reduce transfer size for text assets and API JSON.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Default slot is blue; deploy script updates this include and reloads nginx.
    set $backend_upstream http://app_blue:9000;
    set $frontend_upstream http://frontend_blue:3000;
    include /etc/nginx/includes/backend-upstream.inc;

    # Shared proxy settings to reduce intermittent upstream stalls.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Heavily cache immutable Next.js build artifacts on clients.
    location ^~ /_next/static/ {
        proxy_pass $frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /api/ {
        proxy_pass $backend_upstream;
    }

    location /admin/ {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
